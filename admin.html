<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard • Safety Ninja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-10">
  <h1 class="text-4xl font-bold text-amber-400 mb-8">Admin Dashboard - Suggested Terminals</h1>
  
  <div id="suggestions" class="space-y-6"></div>
</div>

<script>
  const SUPABASE_URL = 'https://ciljonavusljhvkrdyxo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_E0HIlMVQuYRB1ZBHP4t3NA_5xyFI6AK';

  async function loadSuggestions() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/suggested_terminals?select=*&status=eq.pending&order=submitted_at.desc`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    const data = await res.json();
    renderSuggestions(data);
  }

  function renderSuggestions(data) {
    const container = document.getElementById('suggestions');
    if (data.length === 0) {
      container.innerHTML = `<p class="text-gray-400 text-center py-20">No pending suggestions.</p>`;
      return;
    }

    container.innerHTML = data.map(s => `
      <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6">
        <h3 class="font-bold text-xl">${s.name}</h3>
        <p class="text-gray-400">${s.city}, ${s.state}</p>
        ${s.address ? `<p class="text-sm text-gray-500">${s.address}</p>` : ''}
        <div class="mt-6 flex gap-4">
          <button onclick="approveSuggestion('${s.id}')" 
                  class="flex-1 bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-medium">
            ✅ Approve
          </button>
          <button onclick="rejectSuggestion('${s.id}')" 
                  class="flex-1 bg-red-600 hover:bg-red-500 py-4 rounded-2xl font-medium">
            ❌ Reject
          </button>
        </div>
      </div>
    `).join('');
  }

  async function approveSuggestion(id) {
    if (!confirm("Approve this terminal?")) return;
    
    await fetch(`${SUPABASE_URL}/rest/v1/suggested_terminals?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: 'approved' })
    });
    loadSuggestions();
  }

  async function rejectSuggestion(id) {
    if (!confirm("Reject this suggestion?")) return;
    
    await fetch(`${SUPABASE_URL}/rest/v1/suggested_terminals?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: 'rejected' })
    });
    loadSuggestions();
  }

  // Load suggestions when page opens
  loadSuggestions();
</script>
</body>
</html>
