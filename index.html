<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rack Wait Predictor • Safety Ninja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .card { transition: all 0.3s ease; }
    .card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.4); }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-10">
  <div class="text-center mb-12">
    <h1 class="text-5xl font-bold text-amber-400 mb-3">Rack Wait Predictor</h1>
    <p class="text-xl text-gray-400">Crowdsourced real-time wait times for fuel terminals</p>
  </div>

  <!-- Controls -->
  <div class="flex flex-col md:flex-row gap-4 mb-10">
    <input type="text" id="searchInput" 
           placeholder="Search terminals or cities..." 
           class="flex-1 bg-gray-900 border border-gray-700 rounded-3xl px-8 py-5 text-lg focus:outline-none focus:border-amber-500">
    
    <select id="stateFilter" class="bg-gray-900 border border-gray-700 rounded-3xl px-6 py-5 text-lg">
      <option value="">All States</option>
      <option value="CA">California</option>
      <option value="TX">Texas</option>
      <option value="NV">Nevada</option>
      <option value="AZ">Arizona</option>
    </select>
  </div>

  <!-- Big Check-In Button -->
  <div class="flex justify-center mb-12">
    <button onclick="showCheckInModal()" 
            class="bg-amber-500 hover:bg-amber-600 text-black font-bold text-2xl px-14 py-7 rounded-3xl flex items-center gap-4 shadow-xl">
      <i class="fas fa-clock text-3xl"></i> 
      I'M AT A RACK — CHECK IN NOW
    </button>
  </div>

  <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

<!-- Check-In Modal -->
<div id="checkInModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-3xl p-8 max-w-md w-full mx-4">
    <h2 class="text-2xl font-bold mb-6">Check In at Terminal</h2>
    
    <select id="terminalSelect" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 mb-6 text-lg"></select>
    
    <div class="mb-6">
      <label class="block text-sm text-gray-400 mb-2">Estimated additional wait time (minutes)</label>
      <input type="number" id="estWait" value="25" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 text-lg">
    </div>

    <button onclick="submitCheckIn()" class="w-full bg-green-600 hover:bg-green-500 py-5 rounded-2xl font-bold text-xl mb-3">
      ✅ Submit Check-In
    </button>
    <button onclick="hideCheckInModal()" class="w-full text-gray-400 py-3">Cancel</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ciljonavusljhvkrdyxo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_E0HIlMVQuYRB1ZBHP4t3NA_5xyFI6AK';

  // Expanded Terminal Database
  let terminals = [
    {id:"benicia-valero", name:"Valero Benicia", city:"Benicia", state:"CA"},
    {id:"martinez-shell", name:"Shell Martinez", city:"Martinez", state:"CA"},
    {id:"richmond-chevron", name:"Chevron Richmond", city:"Richmond", state:"CA"},
    {id:"carson-marathon", name:"Marathon Carson", city:"Carson", state:"CA"},
    {id:"stockton-valero", name:"Valero Stockton", city:"Stockton", state:"CA"},
    {id:"bakersfield-kern", name:"Kern Oil Bakersfield", city:"Bakersfield", state:"CA"},
    {id:"wilmington", name:"Wilmington Refinery", city:"Wilmington", state:"CA"},
    {id:"long-beach", name:"Long Beach Terminal", city:"Long Beach", state:"CA"},
    {id:"houston-motiva", name:"Motiva Houston", city:"Houston", state:"TX"},
    {id:"houston-exxon", name:"ExxonMobil Houston", city:"Houston", state:"TX"},
    {id:"beaumont", name:"Beaumont Terminal", city:"Beaumont", state:"TX"},
    {id:"corpus-christi", name:"Corpus Christi Refinery", city:"Corpus Christi", state:"TX"},
    {id:"dallas-fuel", name:"Dallas Fuel Terminal", city:"Dallas", state:"TX"},
    {id:"phoenix", name:"Phoenix Terminal", city:"Phoenix", state:"AZ"},
    {id:"las-vegas", name:"Las Vegas Rack", city:"Las Vegas", state:"NV"}
    // Add more terminals easily here
  ];

  async function submitCheckIn() {
    const terminalId = document.getElementById('terminalSelect').value;
    const estWait = parseInt(document.getElementById('estWait').value) || 30;
    const terminal = terminals.find(t => t.id === terminalId);
    
    if (!terminal) return alert("Please select a terminal");

    try {
      await fetch(`${SUPABASE_URL}/rest/v1/rack_reports`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          terminal_id: terminal.id,
          terminal_name: terminal.name,
          city: terminal.city,
          state: terminal.state,
          arrived_at: new Date().toISOString(),
          est_wait_minutes: estWait
        })
      });

      alert(`✅ Check-in recorded at ${terminal.name}!\nThank you for helping other drivers.`);
      hideCheckInModal();
      loadReports();
    } catch (e) {
      alert("Failed to save check-in. Please try again.");
      console.error(e);
    }
  }

  function showCheckInModal() {
    const select = document.getElementById('terminalSelect');
    select.innerHTML = `<option value="">Select Terminal...</option>` + 
      terminals.map(t => `<option value="${t.id}">${t.name} (${t.city}, ${t.state})</option>`).join('');
    document.getElementById('checkInModal').classList.remove('hidden');
  }

  function hideCheckInModal() {
    document.getElementById('checkInModal').classList.add('hidden');
  }

  async function loadReports() {
    const container = document.getElementById('results');
    container.innerHTML = `<p class="col-span-full text-center py-20 text-gray-400">Loading recent reports...</p>`;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rack_reports?select=*&order=arrived_at.desc&limit=30`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      const reports = await res.json();

      if (reports.length === 0) {
        renderTerminals(terminals);
      } else {
        renderReports(reports);
      }
    } catch (e) {
      console.error(e);
      renderTerminals(terminals);
    }
  }

  function renderTerminals(data) {
    const container = document.getElementById('results');
    container.innerHTML = data.map(t => `
      <div class="card bg-gray-900 border border-gray-700 rounded-3xl p-6">
        <h3 class="font-bold text-xl">${t.name}</h3>
        <p class="text-gray-400">${t.city}, ${t.state}</p>
        <div class="mt-8 text-amber-400 text-5xl font-mono font-light">—</div>
        <p class="text-xs text-gray-500">No recent reports</p>
        <button onclick="quickCheckIn('${t.id}', '${t.name}')" 
                class="mt-6 w-full bg-gray-800 hover:bg-amber-600 hover:text-black py-4 rounded-2xl text-sm font-medium">
          Check In Here
        </button>
      </div>
    `).join('');
  }

  function quickCheckIn(id, name) {
    const terminal = terminals.find(t => t.id === id);
    if (terminal) {
      document.getElementById('terminalSelect').value = id;
      showCheckInModal();
    }
  }

  // Search functionality
  document.getElementById('searchInput').addEventListener('input', filterResults);
  document.getElementById('stateFilter').addEventListener('change', filterResults);

  function filterResults() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const state = document.getElementById('stateFilter').value;
    
    const filtered = terminals.filter(t => {
      const matchesSearch = t.name.toLowerCase().includes(searchTerm) || 
                           t.city.toLowerCase().includes(searchTerm);
      const matchesState = !state || t.state === state;
      return matchesSearch && matchesState;
    });
    
    renderTerminals(filtered);
  }

  // Initial load
  loadReports();
</script>

</body>
</html>
