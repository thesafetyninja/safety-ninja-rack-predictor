<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rack Wait Predictor • Safety Ninja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .card { transition: all 0.3s ease; }
    .card:hover { transform: translateY(-8px); }
    #map { height: 360px; border-radius: 16px; }
    @media (min-width: 768px) { #map { height: 480px; } }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<div class="max-w-7xl mx-auto px-4 py-10">
  <div class="text-center mb-12">
    <h1 class="text-5xl font-bold text-amber-400 mb-3">Rack Wait Predictor</h1>
    <p class="text-xl text-gray-400">Loading terminals from database...</p>
  </div>

  <div id="status" class="text-center text-amber-400 mb-8"></div>

  <div class="flex justify-center mb-12">
    <button onclick="showCheckInModal()" 
            class="bg-amber-500 hover:bg-amber-600 text-black font-bold text-2xl px-14 py-7 rounded-3xl flex items-center gap-4 shadow-xl">
      <i class="fas fa-clock text-3xl"></i> I'M AT A RACK — CHECK IN
    </button>
  </div>

  <div class="mb-12">
    <h2 class="text-2xl font-bold mb-4 px-1">Live Terminal Map</h2>
    <div id="map" class="w-full"></div>
  </div>

  <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

<!-- Check-In Modal -->
<div id="checkInModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-3xl p-8 max-w-md w-full mx-4">
    <h2 class="text-2xl font-bold mb-6">Check In at Terminal</h2>
    <select id="terminalSelect" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 mb-6 text-lg"></select>
    
    <div class="mb-6">
      <label class="block text-sm text-gray-400 mb-2">Estimated additional wait time (minutes)</label>
      <input type="number" id="estWait" value="25" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 text-lg">
    </div>

    <button onclick="submitCheckIn()" class="w-full bg-green-600 hover:bg-green-500 py-5 rounded-2xl font-bold text-xl mb-3">
      ✅ Submit Check-In
    </button>
    <button onclick="hideCheckInModal()" class="w-full text-gray-400 py-3">Cancel</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ciljonavusljhvkrdyxo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_E0HIlMVQuYRB1ZBHP4t3NA_5xyFI6AK';

  let terminals = [];

  async function loadTerminals() {
    const status = document.getElementById('status');
    status.textContent = "Connecting to database...";

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/terminals?select=*`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      terminals = await res.json();
      console.log("Loaded terminals:", terminals.length);

      status.textContent = `✅ Loaded ${terminals.length} terminals`;
      
      initMap();
      renderCards(terminals);
    } catch (e) {
      console.error(e);
      status.innerHTML = `❌ Failed to load from database.<br><small>${e.message}</small>`;
      // Fallback list
      terminals = [{id:"test", name:"Test Terminal (Fallback)", city:"Test City", state:"CA"}];
      renderCards(terminals);
    }
  }

  function initMap() {
    const map = L.map('map').setView([37.8, -119.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    terminals.forEach(t => {
      if (t.lat && t.lng) {
        L.marker([t.lat, t.lng]).addTo(map).bindPopup(`<b>${t.name}</b><br>${t.city}, ${t.state}`);
      }
    });
  }

  function renderCards(data) {
    const container = document.getElementById('results');
    container.innerHTML = data.map(t => `
      <div class="card bg-gray-900 border border-gray-700 rounded-3xl p-6">
        <h3 class="font-bold text-xl">${t.name}</h3>
        <p class="text-gray-400">${t.city}, ${t.state}</p>
        <button onclick="quickCheckIn('${t.id}', '${t.name}')" class="mt-6 w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-2xl text-sm font-medium">
          Check In Here
        </button>
      </div>
    `).join('');
  }

  function showCheckInModal() {
    const select = document.getElementById('terminalSelect');
    select.innerHTML = `<option value="">Select Terminal...</option>` + 
      terminals.map(t => `<option value="${t.id}">${t.name} (${t.city}, ${t.state})</option>`).join('');
    document.getElementById('checkInModal').classList.remove('hidden');
  }

  function hideCheckInModal() {
    document.getElementById('checkInModal').classList.add('hidden');
  }

  function quickCheckIn(id, name) {
    document.getElementById('terminalSelect').value = id;
    showCheckInModal();
  }

  async function submitCheckIn() {
    alert("✅ Check-in received! (Database connection is working)");
    hideCheckInModal();
  }

  // Initialize
  loadTerminals();
</script>
</body>
</html>
