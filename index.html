<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rack Wait Predictor • Safety Ninja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .card { transition: all 0.3s ease; }
    .card:hover { transform: translateY(-8px); }
    #map { height: 360px; border-radius: 16px; }
    @media (min-width: 768px) { #map { height: 480px; } }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<div class="max-w-7xl mx-auto px-4 py-10">
  <div class="text-center mb-12">
    <h1 class="text-5xl font-bold text-amber-400 mb-3">Rack Wait Predictor</h1>
    <p class="text-xl text-gray-400">Nationwide • Crowdsourced • Real-time</p>
  </div>

  <div class="flex flex-col md:flex-row gap-4 mb-10">
    <input type="text" id="searchInput" placeholder="Search terminals or cities..." 
           class="flex-1 bg-gray-900 border border-gray-700 rounded-3xl px-8 py-5 text-lg focus:outline-none focus:border-amber-500">
    <select id="stateFilter" class="bg-gray-900 border border-gray-700 rounded-3xl px-6 py-5 text-lg">
      <option value="">All States</option>
      <option value="CA" selected>California</option>
      <option value="TX">Texas</option>
    </select>
  </div>

  <div class="flex justify-center gap-4 mb-12">
    <button onclick="showCheckInModal()" 
            class="bg-amber-500 hover:bg-amber-600 text-black font-bold text-xl px-10 py-5 rounded-3xl flex items-center gap-3">
      <i class="fas fa-clock"></i> CHECK IN
    </button>
    <button onclick="showSuggestModal()" 
            class="bg-gray-700 hover:bg-gray-600 text-white font-bold text-xl px-10 py-5 rounded-3xl flex items-center gap-3">
      <i class="fas fa-plus"></i> Suggest New Terminal
    </button>
  </div>

  <div class="mb-12">
    <h2 class="text-2xl font-bold mb-4">Live Terminal Map</h2>
    <div id="map" class="w-full"></div>
  </div>

  <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

<!-- Check-In Modal -->
<div id="checkInModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-3xl p-8 max-w-md w-full mx-4">
    <h2 class="text-2xl font-bold mb-6">Check In at Terminal</h2>
    <select id="terminalSelect" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 mb-6 text-lg"></select>
    
    <div class="mb-6">
      <label class="block text-sm text-gray-400 mb-2">Estimated additional wait time (minutes)</label>
      <input type="number" id="estWait" value="25" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 text-lg">
    </div>

    <button onclick="submitCheckIn()" class="w-full bg-green-600 hover:bg-green-500 py-5 rounded-2xl font-bold text-xl mb-3">
      ✅ Submit Check-In
    </button>
    <button onclick="hideCheckInModal()" class="w-full text-gray-400 py-3">Cancel</button>
  </div>
</div>

<!-- Suggest New Terminal Modal -->
<div id="suggestModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-3xl p-8 max-w-md w-full mx-4">
    <h2 class="text-2xl font-bold mb-6">Suggest New Terminal</h2>
    
    <input id="suggestName" type="text" placeholder="Terminal Name" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 mb-4">
    <input id="suggestAddress" type="text" placeholder="Address (optional)" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 mb-4">
    <input id="suggestCity" type="text" placeholder="City" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 mb-4">
    <input id="suggestState" type="text" placeholder="State (e.g. CA)" maxlength="2" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-6 py-4 mb-6">
    
    <button onclick="submitSuggestion()" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-bold text-xl mb-3">
      Submit Suggestion
    </button>
    <button onclick="hideSuggestModal()" class="w-full text-gray-400 py-3">Cancel</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ciljonavusljhvkrdyxo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_E0HIlMVQuYRB1ZBHP4t3NA_5xyFI6AK';

  let terminals = [];
  let map;

  async function loadData() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/terminals?select=*`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      });
      terminals = await res.json();
      initMap();
      renderCards(terminals);
    } catch (e) {
      console.error(e);
    }
  }

  function initMap() {
    map = L.map('map').setView([36.8, -119.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    terminals.forEach(t => {
      if (t.lat && t.lng) {
        L.marker([t.lat, t.lng]).addTo(map)
          .bindPopup(`<b>${t.name}</b><br>${t.city}, ${t.state}`);
      }
    });
  }

  function showCheckInModal() {
    // ... (existing check-in modal code)
  }

  function hideCheckInModal() {
    document.getElementById('checkInModal').classList.add('hidden');
  }

  async function submitCheckIn() {
    // ... (existing check-in logic)
    alert("✅ Check-in recorded! Thank you.");
    hideCheckInModal();
  }

  // === NEW: Suggest New Terminal ===
  function showSuggestModal() {
    document.getElementById('suggestModal').classList.remove('hidden');
  }

  function hideSuggestModal() {
    document.getElementById('suggestModal').classList.add('hidden');
  }

  async function submitSuggestion() {
    const name = document.getElementById('suggestName').value.trim();
    const address = document.getElementById('suggestAddress').value.trim();
    const city = document.getElementById('suggestCity').value.trim();
    const state = document.getElementById('suggestState').value.trim().toUpperCase();

    if (!name || !city || !state) {
      alert("Please fill in Name, City, and State.");
      return;
    }

    try {
      await fetch(`${SUPABASE_URL}/rest/v1/suggested_terminals`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: name,
          address: address,
          city: city,
          state: state,
          status: 'pending'
        })
      });

      alert("✅ Thank you! Your terminal suggestion has been submitted for review.");
      hideSuggestModal();
      
      // Clear form
      document.getElementById('suggestName').value = '';
      document.getElementById('suggestAddress').value = '';
      document.getElementById('suggestCity').value = '';
      document.getElementById('suggestState').value = '';
    } catch (e) {
      alert("Error submitting suggestion. Please try again.");
    }
  }

  function renderCards(data) {
    const container = document.getElementById('results');
    container.innerHTML = data.map(t => `
      <div class="card bg-gray-900 border border-gray-700 rounded-3xl p-6">
        <h3 class="font-bold text-xl">${t.name}</h3>
        <p class="text-gray-400">${t.city}, ${t.state}</p>
        <button onclick="quickCheckIn('${t.id}', '${t.name}')" 
                class="mt-6 w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-2xl text-sm font-medium">
          Check In Here
        </button>
      </div>
    `).join('');
  }

  function quickCheckIn(id, name) {
    document.getElementById('terminalSelect').value = id;
    showCheckInModal();
  }

  // Search & Filter (simplified)
  document.getElementById('searchInput').addEventListener('input', filterResults);
  document.getElementById('stateFilter').addEventListener('change', filterResults);

  function filterResults() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const state = document.getElementById('stateFilter').value;
    const filtered = terminals.filter(t => 
      (!term || t.name.toLowerCase().includes(term) || t.city.toLowerCase().includes(term)) &&
      (!state || t.state === state)
    );
    renderCards(filtered);
  }

  // Initialize
  loadData();
</script>
</body>
</html>
